<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/">{{brand_html}}</a>

    <nav id="primary-nav" aria-label="Primary">
      <a href="/#domains" data-nav="domains">Domains</a>
      <a href="/check" data-nav="check">Check a name</a>
      <a href="/status" data-nav="status">Status</a>
      <a href="/abuse" data-nav="abuse">Abuse</a>
      <a href="/#faq" data-nav="how">How it works</a>
      <a href="https://github.com/{{registry_repo}}">GitHub</a>
    </nav>
    <div class="header-actions">
      <button class="theme-switch" type="button" data-theme-toggle data-theme-current="system" aria-label="Color theme: follow device" title="Color theme: follow device">
        <span class="theme-icon" data-theme-icon="system" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/></svg>
        </span>
        <span class="theme-icon" data-theme-icon="light" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </span>
        <span class="theme-icon" data-theme-icon="dark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
        </span>
      </button>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open menu">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
    </div>
</header>
