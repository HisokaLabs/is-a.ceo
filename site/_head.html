<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="description" content="{{page_description}}">
<link rel="canonical" href="{{page_url}}">
<meta name="robots" content="{{page_robots}}">
<meta property="og:type" content="{{og_type}}">
<meta property="og:site_name" content="{{site_domain}}">
<meta property="og:title" content="{{page_title}}">
<meta property="og:description" content="{{page_description}}">
<meta property="og:url" content="{{page_url}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{site_domain}}, free subdomains claimed with a pull request">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{page_title}}">
<meta name="twitter:description" content="{{page_description}}">
<meta name="twitter:image" content="{{og_image}}">
<meta name="theme-color" content="#faf9f5">
<script type="application/ld+json">{{page_jsonld}}</script>
<link rel="icon" type="image/svg+xml" data-icon="light" href="/favicon.svg?v={{asset_version}}" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" data-icon="dark" href="/favicon-dark.svg?v={{asset_version}}" media="(prefers-color-scheme: dark)">
<link rel="llms.txt" href="/llms.txt">
<script src="/assets/theme.js?v={{asset_version}}"></script>
<link rel="stylesheet" href="/assets/style.css?v={{asset_version}}">
