name: pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 * * * *'   # hourly, so the list stays fresh even without a push
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # While the register repo is private, github.token cannot read it; set a
      # REGISTRY_READ_TOKEN secret (fine-grained PAT, read-only on the register
      # repo) and it is used here. Falls back to github.token, which is enough
      # once the register repo is public.
      - name: Check out the registry
        uses: actions/checkout@v5
        with:
          repository: HisokaLabs/open-subdomains
          ref: main
          path: registry
          token: ${{ secrets.REGISTRY_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Build static site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
